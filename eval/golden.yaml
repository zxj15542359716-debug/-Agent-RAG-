# ============================================================================================
# 【第 1 步 · 1.2 说明】评测标注集（本文件的作用与制作方式）
# --------------------------------------------------------------------------------------------
# 为什么需要它：
#   改造检索（切分/混合召回/重排）的每一步都是可调参数，没有度量就只能拍脑袋；
#   这份 52 题标注集让"改完到底有没有变好"变成一个可复跑、可对比的数字
#   （recall@5 命中率 / MRR@10），也是防止后续改动把效果悄悄改差的回归网。
# 怎么标注的：
#   从 5 个知识库文件中按等距抽样挑条目，再由条目内容反写成"用户口吻的问题"；
#   relevant 标注到"来源文件 + 条目号"（即 chunk.id 的两段），与索引切分对齐——
#   切分策略升级或索引重建后标注依然有效（这正是 chunk.id 设计成稳定主键的原因）。
# 题目分布（对应文件条数）：故障排除 14 / 100问1 14 / 100问2 10 / 维护保养 7 / 选购指南 7。
# 出题时的两个刻意设计：
#   ① 部分题目口语化（"像幻灯片一样不流畅"、"回弹很慢"），考查语义召回；
#   ② 部分题目含精确词（8000Hz、48kHz、DPI 数值、RT），考查关键词路的价值——
#      hybrid 相对纯向量的提升主要来自这类题。
# 怎么用：
#   python -m eval.run_retrieval --modes vector_k3,vector_k40,hybrid,hybrid_rerank
#   结果写入 eval/results/ 下（每题命中明细 + 汇总对比表）。
# 怎么扩充：追加 items 条目即可；relevant 支持多命中（如 w111 同时接受两个文件的问101/问241）。
# ============================================================================================
